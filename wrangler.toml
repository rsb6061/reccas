name = "reccas"
main = "src/index.js"
account_id = "fa11326492b5746f2276e22286c4d33d"
compatibility_date = "2026-09-21"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "reccas.com/*", zone_name = "reccas.com" },
  { pattern = "www.reccas.com/*", zone_name = "reccas.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "reccas"
database_id = "f06da302-549f-4059-a8bd-39956188c1d8"

# Set TRENDING to "on" to show the trending section on the homepage; /trending always works for preview.
[vars]
TRENDING = "off"

# Cloudflare Email Service, sending from hello@reccas.com.
[[send_email]]
name = "EMAIL"

[triggers]
crons = ["17 9 * * *"]
