name: Sync prices now

# Runs the price check on demand, in batches, instead of waiting for the next scheduled run.
on:
  workflow_dispatch:
    inputs:
      batches:
        description: "How many batches of about 44 products to check"
        default: "4"

permissions:
  contents: read

concurrency:
  group: reccas-verify-sources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rotate the results key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "$KEY" | npx wrangler secret put VERIFY_KEY
          echo "VERIFY_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Check prices
        env:
          BATCHES: ${{ inputs.batches || '4' }}
        run: |
          sleep 15
          for i in $(seq 1 "$BATCHES"); do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o out.json -w '%{http_code}' -X POST -H "x-verify-key: $VERIFY_KEY" https://reccas.com/_api/admin/sync-prices)
              if [ "$code" != "401" ]; then break; fi
              sleep 8
            done
            echo "batch $i: HTTP $code $(cat out.json)"
            if [ "$code" != "200" ]; then exit 1; fi
          done
