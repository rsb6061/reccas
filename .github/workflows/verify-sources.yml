name: Verify sources

# Weekly: re-read every cited source article and record whether it still names the product.
on:
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reccas-verify-sources
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rotate the results key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "$KEY" | npx wrangler secret put VERIFY_KEY
          echo "VERIFY_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Check sources and record results
        run: node scripts/verify-sources.mjs
