name: Creator source discovery pilot
on:
  workflow_dispatch:
  schedule:
    - cron: "13 10 * * 2"
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/creator-pilot-discover.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: creator-pilot-discovery
          path: reports/creator-pilot.json
          retention-days: 30
