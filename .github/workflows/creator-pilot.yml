name: Creator source discovery and evidence pilot

on:
  push:
    branches: [main]
    paths:
      - "data/creator-pilot-sources.json"
      - "src/creator-pilot.js"
      - "scripts/creator-pilot-*.mjs"
      - ".github/workflows/creator-pilot.yml"
  workflow_dispatch:
    inputs:
      article_limit:
        description: "Maximum eligible shopping articles to extract"
        default: "24"
        required: false
  schedule:
    - cron: "13 10 * * 2"

permissions:
  contents: read

concurrency:
  group: reccas-verify-sources
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Validate source scripts and Worker module
        run: |
          node --check src/creator-pilot.js
          node --check scripts/creator-pilot-discover.mjs
          node --check scripts/creator-pilot-extract.mjs
          npm run check
      - name: Wait for Worker route to deploy
        run: |
          ok=0
          for attempt in $(seq 1 48); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://reccas.com/_api/creator-pilot/summary" || true)
            if [ "$status" = "200" ]; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::Pilot Worker route did not deploy"; exit 1; fi
      - name: Rotate verification key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Missing Cloudflare deployment token"; exit 1; fi
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "$KEY" | npx wrangler secret put VERIFY_KEY
          echo "VERIFY_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Discover recently published creator posts
        run: node scripts/creator-pilot-discover.mjs
        env:
          LIMIT: "108"
          DAYS: "90"
      - name: Extract and store recent creator recommendations
        run: node scripts/creator-pilot-extract.mjs
        env:
          LIMIT: ${{ inputs.article_limit || '24' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-pilot-research
          path: reports/creator-pilot*.json
          if-no-files-found: warn
          retention-days: 30
