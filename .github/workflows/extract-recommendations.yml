name: Extract recommendations

# Reads cited articles and records every product each one recommends. Uses the Worker's AI key,
# so the number of articles per run is capped. Runs monthly, or by hand with a chosen limit.
on:
  push:
    branches: [main]
    paths:
      - "data/category-sources.json"
  schedule:
    - cron: "41 12 3 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum articles to read in this run"
        default: "5"

permissions:
  contents: read

# Shares a group with the source check because both rotate the same results key.
concurrency:
  group: reccas-verify-sources
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rotate the results key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "$KEY" | npx wrangler secret put VERIFY_KEY
          echo "VERIFY_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Look for new guides on publishers' own sites
        run: node scripts/discover-sources.mjs
      - name: Read articles
        env:
          LIMIT: ${{ inputs.limit || '200' }}
        run: node scripts/extract-recommendations.mjs
      - name: Rematch extracted recommendations to known products
        run: |
          curl -fsS -X POST "https://reccas.com/_api/admin/rematch-candidates" \
            -H "x-verify-key: $VERIFY_KEY" \
            -H "content-type: application/json"
