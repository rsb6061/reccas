name: Test consensus in another category

# A private test: reads a few articles on one product question and prints how much they agree. Saves nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

# Shares a group with the source check because both rotate the same results key.
concurrency:
  group: reccas-verify-sources
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rotate the results key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "$KEY" | npx wrangler secret put VERIFY_KEY
          echo "VERIFY_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Read the test articles and report agreement
        run: node scripts/consensus-test.mjs
